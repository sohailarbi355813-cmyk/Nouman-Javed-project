<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Ocean Swim Academy | Sign In</title>
    <!-- Favicon link pointing to separate assets/images folder -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0E11',
                        primary: '#22bbee',
                        primaryHover: '#3ce1ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark text-white font-sans selection:bg-primary selection:text-dark min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/10 transition-all duration-300 py-4">
        <nav aria-label="Main Navigation" class="max-w-7xl mx-auto px-5 sm:px-10 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 text-2xl font-bold tracking-wider text-primary">
                <img src="assets/images/favicon.svg" alt="Blue Ocean Logo" class="w-8 h-8 rounded-lg shadow-sm">
                <span>BLUE<span class="text-white">OCEAN</span></span>
            </a>
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">Home</a>
                <a href="about.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">About</a>
                <a href="contact.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">Contact</a>
            </div>
            <div class="hidden md:flex items-center gap-4">
                <a href="signin.html" class="text-sm font-semibold text-primary transition-colors" aria-current="page">Sign In</a>
                <a href="signup.html" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-primary hover:bg-primaryHover text-dark font-bold text-sm tracking-wide transition-all shadow-[0_4px_14px_rgba(34,187,238,0.39)]">Sign Up</a>
            </div>
            <div class="md:hidden">
                <button id="mobile-menu-btn" aria-label="Toggle mobile menu" aria-expanded="false" class="text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </nav>
        <nav id="mobile-menu" aria-label="Mobile Navigation" class="hidden md:hidden absolute top-full left-0 w-full glass border-b border-white/10 py-4 flex flex-col items-center gap-4">
            <a href="index.html" class="text-sm font-semibold text-white/90 hover:text-primary">Home</a>
            <a href="about.html" class="text-sm font-semibold text-white/90 hover:text-primary">About</a>
            <a href="contact.html" class="text-sm font-semibold text-white/90 hover:text-primary">Contact</a>
            <a href="signin.html" class="text-sm font-semibold text-primary" aria-current="page">Sign In</a>
            <a href="signup.html" class="text-sm font-semibold text-white/90 hover:text-primary">Sign Up</a>
        </nav>
    </header>
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            menuBtn.setAttribute('aria-expanded', !isHidden);
        });
    </script>

    <main id="main-content" class="flex-grow flex items-center justify-center pt-24 pb-12 px-5">
        <article aria-labelledby="signin-heading" class="w-full max-w-md glass p-8 sm:p-10 rounded-3xl relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/20 blur-3xl rounded-full"></div>
            
            <header class="text-center mb-8 relative z-10">
                <h1 id="signin-heading" class="text-3xl font-bold mb-2">Welcome Back</h1>
                <p class="text-sm text-gray-400">Sign in to access your dashboard</p>
            </header>

            <form action="#" method="POST" class="space-y-6 relative z-10">
                <div class="space-y-1.5">
                    <label for="signin-email" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Email Address</label>
                    <input id="signin-email" type="email" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="name@example.com">
                </div>

                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="signin-password" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-primary hover:text-primaryHover">Forgot password?</a>
                    </div>
                    <input id="signin-password" type="password" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="••••••••">
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-[#13181f] border-white/10 text-primary focus:ring-primary focus:ring-offset-dark">
                    <label for="remember" class="text-sm text-gray-400">Remember me for 30 days</label>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-lg bg-primary hover:bg-primaryHover text-dark font-bold tracking-wide transition-all shadow-[0_4px_14px_rgba(34,187,238,0.39)] mt-2">
                    Sign In
                </button>
            </form>

            <footer class="mt-8 text-center text-sm text-gray-400 relative z-10">
                Don't have an account? <a href="signup.html" class="text-primary hover:text-primaryHover font-semibold">Sign up</a>
            </footer>
        </article>
    </main>

    <footer class="bg-[#050709] border-t border-white/10 py-8">
        <div class="max-w-7xl mx-auto px-5 sm:px-10 flex flex-col md:flex-row items-center justify-between gap-4">
            <small class="text-sm text-gray-500">
                &copy; 2026 Blue Ocean Swim Academy.
            </small>
            <nav aria-label="Legal Links" class="flex items-center gap-4 text-sm text-gray-400">
                <a href="#" class="hover:text-primary transition-colors">Privacy</a>
                <a href="#" class="hover:text-primary transition-colors">Terms</a>
            </nav>
        </div>
    </footer>
</body>
</html>

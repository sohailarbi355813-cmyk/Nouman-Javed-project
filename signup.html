<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Ocean Swim Academy | Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0E11',
                        primary: '#22bbee',
                        primaryHover: '#3ce1ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark text-white font-sans selection:bg-primary selection:text-dark min-h-screen flex flex-col">
    <!-- Navbar Component -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/10 transition-all duration-300 py-4">
        <div class="max-w-7xl mx-auto px-5 sm:px-10 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 text-2xl font-bold tracking-wider text-primary">
                BLUE<span class="text-white">OCEAN</span>
            </a>
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">Home</a>
                <a href="about.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">About</a>
                <a href="contact.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">Contact</a>
            </div>
            <div class="hidden md:flex items-center gap-4">
                <a href="signin.html" class="text-sm font-semibold text-white/90 hover:text-primary transition-colors">Sign In</a>
                <a href="signup.html" class="text-sm font-semibold text-primary transition-colors">Sign Up</a>
            </div>
            <div class="md:hidden">
                <button id="mobile-menu-btn" class="text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full glass border-b border-white/10 py-4 flex flex-col items-center gap-4">
            <a href="index.html" class="text-sm font-semibold text-white/90 hover:text-primary">Home</a>
            <a href="about.html" class="text-sm font-semibold text-white/90 hover:text-primary">About</a>
            <a href="contact.html" class="text-sm font-semibold text-white/90 hover:text-primary">Contact</a>
            <a href="signin.html" class="text-sm font-semibold text-white/90 hover:text-primary">Sign In</a>
            <a href="signup.html" class="text-sm font-semibold text-primary">Sign Up</a>
        </div>
    </nav>
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>

    <!-- Sign Up Form Component -->
    <main class="flex-grow flex items-center justify-center pt-32 pb-12 px-5">
        <div class="w-full max-w-md glass p-8 sm:p-10 rounded-3xl relative overflow-hidden">
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-primary/20 blur-3xl rounded-full"></div>
            
            <div class="text-center mb-8 relative z-10">
                <h2 class="text-3xl font-bold mb-2">Create Account</h2>
                <p class="text-sm text-gray-400">Join the Blue Ocean family today</p>
            </div>

            <form action="#" method="POST" class="space-y-5 relative z-10">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">First Name</label>
                        <input type="text" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="John">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Last Name</label>
                        <input type="text" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="Doe">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Email Address</label>
                    <input type="email" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="name@example.com">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                    <input type="password" required class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-gray-600" placeholder="••••••••">
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Swimming Level</label>
                    <select class="w-full bg-[#13181f] border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <div class="flex items-start gap-2 pt-2">
                    <input type="checkbox" required id="terms" class="w-4 h-4 rounded bg-[#13181f] border-white/10 text-primary focus:ring-primary focus:ring-offset-dark mt-1">
                    <label for="terms" class="text-sm text-gray-400">I agree to the <a href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#" class="text-primary hover:underline">Privacy Policy</a></label>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-lg bg-primary hover:bg-primaryHover text-dark font-bold tracking-wide transition-all shadow-[0_4px_14px_rgba(34,187,238,0.39)] mt-2">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-400 relative z-10">
                Already have an account? <a href="signin.html" class="text-primary hover:text-primaryHover font-semibold">Sign in</a>
            </div>
        </div>
    </main>

    <!-- Footer Component -->
    <footer class="bg-[#050709] border-t border-white/10 py-8">
        <div class="max-w-7xl mx-auto px-5 sm:px-10 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-sm text-gray-500">
                &copy; 2026 Blue Ocean Swim Academy.
            </div>
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <a href="#" class="hover:text-primary transition-colors">Privacy</a>
                <a href="#" class="hover:text-primary transition-colors">Terms</a>
            </div>
        </div>
    </footer>
</body>
</html>
